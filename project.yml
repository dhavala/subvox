name: Subvox
options:
  bundleIdPrefix: com.joeblau
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Subvox:
    type: application
    platform: macOS
    sources: [Subvox]
    info:
      path: Subvox/Info.plist
      properties:
        CFBundleDisplayName: Subvox
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.developer-tools
        NSMotionUsageDescription: Subvox reads AirPods head-motion data to study whether mouthed words can be decoded into text.
        NSMicrophoneUsageDescription: Subvox records microphone audio alongside motion data and transcribes whispered speech for comparison.
        NSSpeechRecognitionUsageDescription: Subvox transcribes microphone audio as a reference for the motion decoder, using on-device recognition when available.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joeblau.subvox
        ENABLE_HARDENED_RUNTIME: NO
  SubvoxTests:
    type: bundle.unit-test
    platform: macOS
    sources: [SubvoxTests]
    dependencies:
      - target: Subvox
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joeblau.subvox.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Subvox:
    build:
      targets:
        Subvox: all
        SubvoxTests: [test]
    test:
      targets: [SubvoxTests]
